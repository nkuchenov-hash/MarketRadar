# Russian VPS deployment (Beget / Timeweb / any Ubuntu server with Docker).
# All service ports except 80/443 stay private to the Docker network.
name: marketradar
services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "512m"
    mem_limit: 3g
    pids_limit: 500
    env_file:
      - ../.env.production
    environment:
      DB_PATH: /app/data/marketradar.sqlite3
      CLOUD_BROWSER_ENABLED: "true"
      CLOUD_BROWSER_PARALLEL: "1"
      CLOUD_SEARCH_SCROLLS: "20"
      CLOUD_BROWSER_HEADFUL: "true"
      CLOUD_BROWSER_PERSISTENT: "true"
      CLOUD_BROWSER_HUMAN_FLOW: "true"
      CLOUD_SEMANTIC_MARKETS: "wb,ozon"
      CLOUD_BROWSER_PROFILE_DIR: /app/data/browser-profiles
      MARKETRADAR_MOBILE_ACCESS_KEY: ${MARKETRADAR_MOBILE_ACCESS_KEY:?Generate a private key before deployment}
      APP_ORIGIN: https://${MARKETRADAR_DOMAIN:?Set DNS name}
      COOKIE_SECURE: "true"
    volumes:
      - radar_data:/app/data
    networks: [internal]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; import json; u=urllib.request.urlopen('http://127.0.0.1:10000/health',timeout=5); assert json.load(u)['ok']"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 4

  ozon-mcp:
    profiles: ["ozon-mcp"]
    image: ozon-customer-mcp:latest
    pull_policy: never
    restart: unless-stopped
    init: true
    shm_size: "1g"
    mem_limit: 1500m
    cpus: 1.5
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    environment:
      OZON_GEOIP: "false"
    entrypoint: ["node", "/probe/ozon-service.mjs"]
    volumes:
      - ./ozon-service.mjs:/probe/ozon-service.mjs:ro
      - ./ozon-service-core.mjs:/probe/ozon-service-core.mjs:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://127.0.0.1:8765/health\").then(r=>r.json()).then(x=>{if(!x.ok||!x.warmed)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      MARKETRADAR_DOMAIN: ${MARKETRADAR_DOMAIN:?Set DNS name}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal:

volumes:
  radar_data:
  caddy_data:
  caddy_config:
