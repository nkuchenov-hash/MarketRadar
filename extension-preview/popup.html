<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketRadar</title><style>
:root{color-scheme:light;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}*{box-sizing:border-box}body{width:350px;margin:0;background:#f6f8fc;color:#11233e}.header{padding:19px 20px;background:white;display:flex;align-items:center;gap:11px;border-bottom:1px solid #e4eaf3}.logo{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:#1b61e8;color:white;font-size:20px;font-weight:800}.header b{font-size:18px}.badge{margin-left:auto;font-size:11px;background:#e7f8ed;color:#187247;border-radius:20px;padding:5px 8px}.main{padding:18px 20px}.status{display:flex;gap:9px;align-items:center;margin:0 0 13px;font-weight:650;font-size:14px}.dot{width:9px;height:9px;background:#239968;border-radius:50%;flex-shrink:0}.muted{color:#5e718b;font-size:12px;line-height:1.65;margin:0 0 14px}.btn{width:100%;border:0;border-radius:9px;padding:13px 10px;font:inherit;font-weight:700;cursor:pointer;margin-bottom:9px}.primary{background:#1d63ed;color:white}.secondary{background:#e9eef7;color:#183d77}.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stores button{background:white;border:1px solid #dbe3ed;border-radius:8px;color:#263c59;font-size:12px;padding:10px 4px;cursor:pointer}.foot{color:#6c7d91;font-size:11px;line-height:1.4;padding:12px 20px 17px;border-top:1px solid #e4eaf3}button:focus-visible{outline:3px solid #81b5ff;outline-offset:2px}
</style></head><body><div class="header"><span class="logo">M</span><b>MarketRadar</b><span class="badge">v1.5</span></div><div class="main"><p class="status"><span class="dot"></span><span id="state">Расширение установлено</span></p><p class="muted">Откройте MarketRadar и введите товар. Поиск выполняется через этот браузер без передачи паролей.</p><button id="open" class="btn primary">Открыть поиск товаров</button><button id="check" class="btn secondary">Проверить подключение</button><p id="diagnostic" class="muted" role="status" aria-live="polite">Обычные вкладки не переключаются во время поиска.</p><div class="stores"><button data-store="https://www.ozon.ru/">Ozon</button><button data-store="https://www.wildberries.ru/">Wildberries</button><button data-store="https://market.yandex.ru/">Яндекс Маркет</button></div></div><div class="foot">Входить в магазины можно в их обычных вкладках. Расширение не запрашивает логины, пароли и cookies.</div><script src="popup.js"></script></body></html>
