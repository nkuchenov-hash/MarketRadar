name: Upstream WB and Market MCP on Russian VPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ru-marketplace-vps.yml]
permissions:
  contents: read
concurrency:
  group: ru-marketplace-vps-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.MARKETRADAR_OZON_TEST_SSH_KEY }}
    steps:
      - name: Run restricted live benchmark from existing VPS
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          umask 077
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_KEY" > "$d/key"
          ssh-keyscan -T 15 -t ed25519 45.147.178.109 > "$d/known_hosts" 2>/dev/null
          fingerprint="$(ssh-keygen -lf "$d/known_hosts" | awk 'NR==1 {print $2}')"
          [[ "$fingerprint" == "SHA256:4l/pLS5IaMUdBIGsHSVgnXTrKFu1+5IkqheJiD6Dua4" ]] || { echo "VPS host key mismatch"; exit 1; }
          ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 marketradar-ru-probe@45.147.178.109 </dev/null 2>&1 | tee ru-marketplace-vps.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru-marketplace-vps
          path: ru-marketplace-vps.log
          if-no-files-found: ignore
