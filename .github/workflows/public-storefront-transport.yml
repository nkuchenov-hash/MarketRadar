name: Check public storefront network access
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-storefront-transport.yml'
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check real first-party search endpoints without authentication
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse, socket, re, html
          from server.public_html import extract_public_html
          from pathlib import Path

          q=urllib.parse.quote("Яндекс Станция Мини 3 Про")
          base="appType=1&curr=rub&dest=-1257786&lang=ru&page=1&query="+q+"&resultset=catalog&sort=priceup&spp=30"
          urls={
            "wb-public-v18":"https://search.wb.ru/exactmatch/ru/common/v18/search?"+base,
            "wb-u-search-v18":"https://u-search.wb.ru/exactmatch/ru/common/v18/search?"+base,
            "wb-site-internal":"https://www.wildberries.ru/__internal/search/exactmatch/ru/common/v18/search?"+base,
            "wb-site-u-internal":"https://www.wildberries.ru/__internal/u-search/exactmatch/ru/common/v18/search?"+base,
            "yandex-search":"https://market.yandex.ru/search?text="+q+"&how=aprice",
            "ozon-search":"https://www.ozon.ru/search/?text="+q+"&sorting=price",
          }
          results={}
          for key,url in urls.items():
            req=urllib.request.Request(url,headers={
              "Accept":"application/json, text/html;q=0.9, */*;q=0.8",
              "Accept-Language":"ru-RU,ru;q=0.9",
              "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
            })
            result={"url_host":urllib.parse.urlparse(url).hostname}
            try:
              with urllib.request.urlopen(req,timeout=14) as response:
                payload=response.read(8500000 if key=='yandex-search' else 1000000)
                result["status"]=response.status
                result["content_type"]=response.headers.get("Content-Type","")
                result["bytes"]=len(payload)
                if "json" in result["content_type"].lower():
                  data=json.loads(payload)
                  group=data.get("data",{}) if isinstance(data,dict) else {}
                  products=group.get("products",[]) if isinstance(group,dict) else []
                  result["product_count"]=len(products)
                  result["top_level_keys"]=list(data.keys())[:12]
                else:
                  result["page_title_present"]=b"<title" in payload.lower()
                  if key=="yandex-search":
                    lowered=payload.lower()
                    result["prefix"]=payload[:600].decode("utf-8","replace")
                    result["contains_product_path"]=lowered.count(b"/product")
                    result["contains_card_path"]=lowered.count(b"/card")
                    result["contains_query_cyrillic"]=payload.count("Яндекс Станция".encode("utf-8"))
                    result["contains_price_ruble"]=payload.count("₽".encode("utf-8"))
                    result["contains_captcha"]=b"captcha" in lowered
                    result["contains_deny"]=b"403" in lowered
                    result["content_encoding"]=response.headers.get("Content-Encoding","")
                    result["response_url_host"]=urllib.parse.urlparse(response.url).hostname
                    content=payload.decode("utf-8","replace")
                    unescaped=html.unescape(content)
                    ssr=extract_public_html(content,"https://market.yandex.ru/search?text="+q)
                    result["ssr_audit"]={
                      "unique_products":ssr["unique_products"],
                      "observed_anchors":ssr["observed_product_anchors"],
                      "priced_anchors":ssr["priced_anchors"],
                      "products":[{
                        "title":x["title"][:90],
                        "price":x["price"],
                        "delivery":x["delivery_hint"],
                        "url_path":urllib.parse.urlparse(x["url"]).path
                      } for x in ssr["links"][:10]]
                    }
                    result["total_read_bytes"]=len(payload)
                    result["html_anchor_count"]=content.count("<a ")
                    result["html_price_mentions"]=content.count("₽")
                    result["json_price_key_mentions"]=content.count('"price"')
                    result["ruble_unicode_escapes"]=content.count("u20bd")
                    result["escaped_product_path_mentions"]=unescaped.count("/product/")
                    result["escaped_offer_path_mentions"]=unescaped.count("/offer/")
                    hrefs=[html.unescape(match.group(2)) for match in
                      re.finditer(r'<a\b[^>]*\bhref=(["\x27])([^"\x27]+)\1',content,re.I)]
                    candidates=list(dict.fromkeys(href for href in hrefs
                      if re.search(r'/(?:product|card|offer)/|/product--',href,re.I)
                    ))
                    result["href_count"]=len(hrefs)
                    result["candidate_product_link_count"]=len(candidates)
                    # Avoid long tracking tokens: expose only canonical public paths.
                    result["candidate_links"]=[urllib.parse.urlparse(
                      urllib.parse.urljoin("https://market.yandex.ru",item)).path
                      for item in candidates[:10]]
                    if candidates:
                      card=urllib.parse.urljoin("https://market.yandex.ru",candidates[0].split("?")[0])
                      try:
                        with urllib.request.urlopen(urllib.request.Request(card,headers={
                          "Accept":"text/html",
                          "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
                          "Accept-Language":"ru-RU,ru;q=0.9"}),timeout=12) as detail:
                          content_detail=detail.read(4000000).decode("utf-8","replace")
                          result["card_probe"]={
                            "http":detail.status,"bytes":len(content_detail),
                            "has_price":content_detail.count("₽"),
                            "has_og_title":bool(re.search(r'property=["\\x27]og:title',content_detail)),
                            "has_schema_product":'schema.org/Product' in content_detail,
                            "has_sold_model":"Мини 3 Про" in content_detail}
                      except urllib.error.HTTPError as ex:
                        result["card_probe"]={"http":ex.code}
                      except Exception as ex:
                        result["card_probe"]={"error":type(ex).__name__}

                    result["product_anchor_samples"]=[]
                    for idx,link in enumerate(candidates[:3]):
                      stem=urllib.parse.urlparse(link).path.split("/")[-1]
                      anchor=re.search(r'<a\b[^>]*href="[^"]*'+re.escape(stem)+r'[^"]*"',content,re.I)
                      if anchor:
                        near=html.unescape(content[max(0,anchor.start()-700):anchor.end()+1200])
                        near=re.sub(r'\b(?:do-waremd5|cpc|show-uid|showUid|cc)=[^&"\\s]+','token=omitted',near)
                        result["product_anchor_samples"].append(near[:1000])
                      else:
                        result["product_anchor_samples"].append("no anchor for "+stem)
                    for link in candidates[:3]:
                      index=content.find(link)
                      result["product_context_"+str(candidates.index(link))]=(
                        html.unescape(content[max(0,index-200):index+350])
                        if index>=0 else "")
                    result["product_link_examples"]=list(dict.fromkeys(
                      re.findall(r"href=['\"]([^'\"]{0,300}(?:product|offer|card)[^'\"]*)",unescaped,re.I)
                    ))[:6]
                    for keyword in ("Яндекс Станция Мини","₽","u20bd","/product/"):
                      ix=unescaped.find(keyword)
                      result["sample_"+keyword.replace("/","_").replace(" ","_")]=(
                        unescaped[max(0,ix-110):ix+220] if ix>=0 else "")
            except urllib.error.HTTPError as exc:
              result["status"]=exc.code
              result["error"]="HTTP blocked or rejected"
            except (urllib.error.URLError,socket.timeout,ValueError,OverflowError) as exc:
              result["error"]=type(exc).__name__
            except json.JSONDecodeError:
              result["error"]="InvalidJSON"
            results[key]=result
            print(key,json.dumps(result,ensure_ascii=False),flush=True)
          Path("transport-report.json").write_text(
             json.dumps(results,indent=2,ensure_ascii=False),encoding="utf-8")
          # Diagnostic only. An unavailable GitHub runner is not a code failure.
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-storefront-transport-report
          path: transport-report.json
          retention-days: 3
