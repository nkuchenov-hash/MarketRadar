name: MarketRadar Android v2 stable signing
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketradar-android-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle public MIT-licensed offline model and tokenizer into APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          model_repo='https://huggingface.co/onnx-community/multilingual-MiniLMv2-L6-mnli-xnli-ONNX/resolve/ca5daf3'
          curl --fail --location --retry 3 --max-time 280 \
            -o android/app/src/main/assets/model-identity-int8.onnx \
            "$model_repo/onnx/model_quantized.onnx"
          curl --fail --location --retry 3 --max-time 120 \
            -o /tmp/tokenizer.json "$model_repo/tokenizer.json"
          test "$(stat -c %s android/app/src/main/assets/model-identity-int8.onnx)" -gt 90000000
          python3 android/scripts/prepare_nli_assets.py /tmp/tokenizer.json android/app/src/main/assets
          test -s android/app/src/main/assets/model-vocab.bin
          echo "Public asset SHA-256:"
          sha256sum android/app/src/main/assets/model-identity-int8.onnx /tmp/tokenizer.json
      - name: Validate real NLI inference on product identity cases
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            'onnxruntime==1.23.2' 'tokenizers==0.22.1' 'numpy<3'
          python3 android/scripts/smoke_local_nli.py \
            android/app/src/main/assets/model-identity-int8.onnx /tmp/tokenizer.json
      - name: Compile and run matching tests
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --console=plain testDebugUnitTest assembleRelease
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Persist signing key privately and produce installable APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dist /tmp/market-signing /tmp/market-prev
          backup_tag=marketradar-private-v2-signing
          signer="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$signer" && test -x "$aapt"
          if gh release view "$backup_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$backup_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$draft" != "true" ]]; then
              echo "::error::Signing backup is public; refusing to sign."
              exit 1
            fi
            gh release download "$backup_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'marketradar-release.jks' \
              --pattern 'marketradar-signing-pass.txt' \
              --pattern 'marketradar-signing-fingerprint.txt' \
              --dir /tmp/market-signing
          else
            echo "Initializing persistent private signing credentials for a NEW Android app identity."
            pass="$(openssl rand -hex 36)"
            printf '%s' "$pass" > /tmp/market-signing/marketradar-signing-pass.txt
            keytool -genkeypair -noprompt \
              -keystore /tmp/market-signing/marketradar-release.jks \
              -storepass "$pass" -keypass "$pass" \
              -alias marketradar-v2 -keyalg RSA -keysize 3072 -validity 36500 \
              -dname "CN=MarketRadar Android v2,O=MarketRadar,C=US" >/dev/null 2>&1
            keytool -list -v -keystore /tmp/market-signing/marketradar-release.jks \
              -storepass "$pass" -alias marketradar-v2 |
              sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' |
              tr '[:upper:]' '[:lower:]' \
              > /tmp/market-signing/marketradar-signing-fingerprint.txt
            test -s /tmp/market-signing/marketradar-signing-fingerprint.txt
            gh release create "$backup_tag" \
              /tmp/market-signing/marketradar-release.jks \
              /tmp/market-signing/marketradar-signing-pass.txt \
              /tmp/market-signing/marketradar-signing-fingerprint.txt \
              --repo "$GITHUB_REPOSITORY" --draft \
              --title "PRIVATE Android v2 signing backup — DO NOT PUBLISH" \
              --notes "Private long-lived signing credentials for com.marketradar.mobile.next. Never publish this draft release or its assets. Repository write access should be strictly limited."
          fi
          test -s /tmp/market-signing/marketradar-release.jks
          test -s /tmp/market-signing/marketradar-signing-pass.txt
          test -s /tmp/market-signing/marketradar-signing-fingerprint.txt
          export MR_SIGNING_PASS="$(cat /tmp/market-signing/marketradar-signing-pass.txt)"
          "$signer" sign \
            --ks /tmp/market-signing/marketradar-release.jks \
            --ks-key-alias marketradar-v2 --ks-pass env:MR_SIGNING_PASS \
            --key-pass env:MR_SIGNING_PASS \
            --out dist/MarketRadar-Android-0.16.0.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs \
            dist/MarketRadar-Android-0.16.0.apk > /tmp/signature.txt
          current="$(grep -i 'sha-256 digest' /tmp/signature.txt | head -1 | sed -E 's/.*digest:[[:space:]]*//' | tr '[:upper:]' '[:lower:]' | tr -dc '0-9a-f')"
          expected="$(keytool -exportcert \
            -keystore /tmp/market-signing/marketradar-release.jks \
            -storepass "$MR_SIGNING_PASS" -alias marketradar-v2 2>/dev/null \
            | sha256sum | awk '{print $1}')"
          [[ -n "$current" && "$current" == "$expected" ]] || {
            echo "::error::Signing fingerprint does not match persistent backup."; exit 1;
          }
          "$aapt" dump badging dist/MarketRadar-Android-0.16.0.apk > /tmp/badging.txt
          grep -Fq "package: name='com.marketradar.mobile.next' versionCode='16' versionName='0.16.0'" /tmp/badging.txt
          if gh release view marketradar-android-0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download marketradar-android-0.4.0 \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'MarketRadar-Android-0.4.0.apk' --dir /tmp/market-prev
            original="$( "$signer" verify --print-certs /tmp/market-prev/MarketRadar-Android-0.4.0.apk | grep -i 'certificate sha-256 digest' | head -1 | sed -E 's/.*digest:[[:space:]]*//' | tr '[:upper:]' '[:lower:]' | tr -dc '0-9a-f' )"
            [[ -n "$original" && "$original" == "$current" ]] || {
              echo "::error::Published v2 signing certificate mismatch"; exit 1;
            }
          fi
          (cd dist && sha256sum MarketRadar-Android-0.16.0.apk > SHA256SUMS.txt)

      - name: Publish isolated stable-signed MarketRadar v2 APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=marketradar-android-0.16.0
          cat > /tmp/notes.md <<'EOF'
          # MarketRadar Android 0.16.0 — signed test build
          Package com.marketradar.mobile.next, same persistent v2 signing certificate.
          Version code 16 upgrades installed v0.14.0 and other v0.2+ APKs
          in place WITHOUT deleting WebView sessions or saved settings.

          Faster price-sorted WB search checks an exact product after two further
          search viewports, BEFORE walking thousands of candidates.
          If early verification finds no eligible delivery, scan automatically
          expands to the complete listing.
          Product-card extraction accepts WB sibling price/title labels and
          lazy image placeholders; missing results report page title and
          number of extracted product links.
          Cheapest confirmed offer is shown even if delivery is later than
          the requested deadline, with a separate timely best price.
          Literal exact-model matches bypass probabilistic AI checks.

          Prior WB search discovery fix: candidate URLs with abbreviated
          listing names like "Умная колонка Станция Мини" now reach their
          full product page and local NLI model verification instead of
          being permanently rejected by strict substring matching.
          Separate model names, image alt text and nearest tile context
          are included as retrieval evidence but never count as verified
          product identity until the full page has been inspected.
          A verified Ozon price can no longer prune uninspected WB products:
          per-store price bounds protect against discount differences.
          The misleading "WB prices are all more expensive" status is removed
          when WB had no confirmed offer.
          Tests include user-reported WB 11 316 RUB and 10 772 RUB listing
          examples, with deadlines 20 and 25 November 2026.
          This does NOT prove that native-app-only WB prices or checkout
          payment promotions can be retrieved by an Android WebView.
          Signed, in-place upgrade retaining marketplace cookies and
          light/dark/theme settings; this remains a test release.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "MarketRadar Android 0.16.0 — stable-signing preview" \
              --notes-file /tmp/notes.md --prerelease
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
              dist/MarketRadar-Android-0.16.0.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              dist/MarketRadar-Android-0.16.0.apk dist/SHA256SUMS.txt \
              --title "MarketRadar Android 0.16.0 — stable-signing preview" \
              --notes-file /tmp/notes.md --prerelease
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name,.size] | @tsv'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarketRadar-Android-test-APK
          path: dist/*
          if-no-files-found: ignore
          retention-days: 10
