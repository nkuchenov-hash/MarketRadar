name: MarketRadar Android build and offline tests (no publication)
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketradar-android-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle public MIT-licensed offline model and tokenizer into APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          model_repo='https://huggingface.co/onnx-community/multilingual-MiniLMv2-L6-mnli-xnli-ONNX/resolve/ca5daf3'
          curl --fail --location --retry 3 --max-time 280 \
            -o android/app/src/main/assets/model-identity-int8.onnx \
            "$model_repo/onnx/model_quantized.onnx"
          curl --fail --location --retry 3 --max-time 120 \
            -o /tmp/tokenizer.json "$model_repo/tokenizer.json"
          test "$(stat -c %s android/app/src/main/assets/model-identity-int8.onnx)" -gt 90000000
          python3 android/scripts/prepare_nli_assets.py /tmp/tokenizer.json android/app/src/main/assets
          test -s android/app/src/main/assets/model-vocab.bin
          echo "Public asset SHA-256:"
          sha256sum android/app/src/main/assets/model-identity-int8.onnx /tmp/tokenizer.json
      - name: Validate real NLI inference on product identity cases
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            'onnxruntime==1.31.1' 'tokenizers==0.22.1' 'numpy<3'
          python3 android/scripts/smoke_local_nli.py \
            android/app/src/main/assets/model-identity-int8.onnx /tmp/tokenizer.json
      - name: Validate first-party Wildberries response capture in WebView
        run: node android/scripts/test_network_capture.js
      - name: Compile and run matching tests
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --console=plain testDebugUnitTest assembleRelease
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk

      # Do not sign, publish or overwrite any APK until the deployed
      # backend has passed the real three-storefront Chromium + Android
      # end-to-end acceptance check. Build success alone is not release approval.
      - name: Keep Android unit-test results (no APK distribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarketRadar-Android-unit-tests
          path: android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 10
