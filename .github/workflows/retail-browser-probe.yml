name: Retail fast browser benchmark
on:
  push:
    branches: [main]
    paths:
      - deploy/retail-browser-probe.py
      - .github/workflows/retail-browser-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser runtime
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
          python -m py_compile deploy/retail-browser-probe.py
      - name: Benchmark bounded public page collection
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
        run: python deploy/retail-browser-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retail-browser-probe
          path: /tmp/retail-browser-probe.json
          if-no-files-found: ignore
