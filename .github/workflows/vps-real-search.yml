name: Real MarketRadar search on deployed Russian VPS
on:
  workflow_run:
    workflows: [Deploy verified MarketRadar release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketradar-live-acceptance
  cancel-in-progress: false
jobs:
  browser-search:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Run guest searches against the published service
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error,http.cookiejar
          from pathlib import Path
          base="https://45-147-178-109.sslip.io"
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          headers={"X-MarketRadar-Guest":"1","Content-Type":"application/json"}
          queries=["Яндекс лампочка 1300 лм","Яндекс Станция Мини 3 Про","Samsung 990 PRO 1TB"]
          shops=["wb","ozon","ym"]
          reports=[]
          def call(path,method="GET",body=None):
              req=urllib.request.Request(base+path,headers=headers,method=method,data=json.dumps(body,ensure_ascii=False).encode() if body is not None else None)
              with client.open(req,timeout=25) as r:return json.load(r)
          for query in queries:
              start=time.monotonic()
              report={"query":query,"markets":{}}
              status={}
              job=None
              try:
                  job=call("/api/mobile/browser/start","POST",{"query":query,"shops":shops,"max_days":3,"allow_late":False})
                  while time.monotonic()-start<230:
                      status=call("/api/mobile/browser/jobs/"+job["id"])
                      if status.get("state")!="running":break
                      time.sleep(5)
                  for shop in shops:
                      m=status.get("markets",{}).get(shop,{})
                      offers=[o for o in status.get("offers",[]) if o.get("market_id")==shop and isinstance(o.get("delivery_days"),int) and 0<=o["delivery_days"]<=3]
                      verified=[o for o in offers if o.get("verified_detail")]
                      best=min(offers,key=lambda o:o["price"],default=None)
                      report["markets"][shop]={"state":m.get("state"),"candidates":m.get("candidates"),"checked":m.get("checked"),"retry":m.get("retry_attempt",0),"coverage_complete":m.get("coverage_complete",False),"offers":len(offers),"verified":len(verified),"best":{k:best.get(k) for k in ("price","title","url","delivery_days","condition")} if best else None,"audit":m.get("audit",{})}
                  report["state"]=status.get("state")
              except Exception as exc:report["error"]=str(exc)
              finally:
                  if job and status.get("state","running")=="running":
                      try:call("/api/mobile/browser/jobs/"+job["id"],"DELETE")
                      except Exception:pass
              report["seconds"]=round(time.monotonic()-start,1)
              reports.append(report)
              print(json.dumps(report,ensure_ascii=False,indent=2),flush=True)
              Path("vps-real-search-evidence.json").write_text(json.dumps(reports,ensure_ascii=False,indent=2),encoding="utf8")
              if query!=queries[-1]:time.sleep(max(0,65-(time.monotonic()-start)))
          # A missing offer means cross-shop comparison has not passed this
          # acceptance sample. Finding offers still does not prove a minimum.
          if any(r.get("state")!="finished" or any(not r.get("markets",{}).get(s,{}).get("offers") for s in shops) for r in reports):
              raise SystemExit("Incomplete cross-store comparison; see evidence")
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-vps-browser-search
          path: vps-real-search-evidence.json
          if-no-files-found: warn
          retention-days: 7
