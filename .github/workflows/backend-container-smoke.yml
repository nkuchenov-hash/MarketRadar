name: Backend Docker deployment smoke
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'server/**'
      - 'deploy/**'
      - 'render.yaml'
      - 'railway.json'
      - '.github/workflows/backend-container-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketradar-backend-docker-smoke
  cancel-in-progress: true
jobs:
  docker-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Russian VPS packaging and Caddy HTTPS gateway
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/bootstrap.sh deploy/update.sh deploy/backup.sh deploy/verify.sh
          printf 'MARKETRADAR_DOMAIN=example.com\nMARKETRADAR_MOBILE_ACCESS_KEY=ci-only-example\n' > .env.production
          docker compose --env-file .env.production -f deploy/compose.vps.yml config --quiet
          docker run --rm --env MARKETRADAR_DOMAIN=example.com \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
          rm .env.production
      - name: Reproduce Beget root bootstrap private file permissions
        shell: bash
        run: |
          # root bootstrap sets umask 077, leaving Git checkout 0700 dirs
          # and 0600 files; this must not prevent the non-root app from booting.
          chmod -R go-rwx server web extension
          test "$(stat -c '%a' server)" = "700"
          test "$(stat -c '%a' server/__init__.py)" = "600"
      - name: Build deployable Chromium backend
        run: docker build -t marketradar-backend:smoke .
      - name: Verify image runtime file permissions without root
        run: |
          docker run --rm --entrypoint python marketradar-backend:smoke -c "import os, pathlib; assert os.getuid() == 10001; [pathlib.Path(p).read_bytes() for p in ('/app/server/__init__.py','/app/web/index.html')]; print('App source is readable to non-root runtime')"

      - name: Launch actual FastAPI container
        run: |
          docker run --detach --rm --name marketradar-backend-smoke \
            --publish 127.0.0.1:18765:10000 \
            --env PORT=10000 --env CLOUD_BROWSER_ENABLED=true \
            --env CLOUD_BROWSER_HEADFUL=true \
            --env CLOUD_BROWSER_PERSISTENT=true \
            --env CLOUD_BROWSER_HUMAN_FLOW=true \
            --env CLOUD_BROWSER_PARALLEL=1 \
            --env MARKETRADAR_MOBILE_ACCESS_KEY=ci-only-example \
            marketradar-backend:smoke
          for retry in $(seq 1 55); do
            if curl -fsS --max-time 4 http://127.0.0.1:18765/health; then
              echo "FastAPI cloud backend booted"
              break
            fi
            sleep 2
          done
          curl -fsS --max-time 10 http://127.0.0.1:18765/health | \
            python -c 'import json,sys; p=json.load(sys.stdin); assert p["ok"] and p["cloud_available"], p'
      - name: Verify full headed Chromium boots with persistent profile in Docker
        shell: bash
        run: |
          docker exec -i marketradar-backend-smoke python - <<'PY'
          import asyncio,os
          from server.cloud_browser import CloudBrowser
          async def run():
              b=CloudBrowser(market="Wildberries")
              await b.start()
              try:
                  p=await b.context.new_page()
                  await p.set_content("<html><title>headed chrome ready</title><body>ok</body></html>")
                  assert await p.title()=="headed chrome ready"
                  print("Xvfb headed Chrome and persistent profile OK",b.headful,b.persistent)
                  assert b.headful and b.persistent
                  await p.close()
              finally:
                  await b.close()
          asyncio.run(run())
          PY
      - name: Run SSR pagination regression in deployable backend
        shell: bash
        run: |
          # Exercise the exact runtime dependencies shipped to the VPS.
          docker cp tests/. marketradar-backend-smoke:/tmp/marketradar-tests/
          # Production requirements remain unchanged: install pytest only into
          # this throwaway smoke-test container for pytest-style regressions.
          docker exec -u 0 marketradar-backend-smoke python -m pip install -q --no-cache-dir pytest
          docker exec marketradar-backend-smoke python -m pytest -q \
            /tmp/marketradar-tests/test_ssr_pagination_failure_ledger.py \
            /tmp/marketradar-tests/test_cloud_verification_evidence.py \
            /tmp/marketradar-tests/test_mobile_cloud_offer_ledger.py
      - name: Verify real Android REST job contract
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, time
          base="http://127.0.0.1:18765"
          try:
              urllib.request.urlopen(base+"/api/mobile/browser/jobs/missing",timeout=5)
              raise AssertionError("Private API exposed without access key")
          except urllib.error.HTTPError as e:
              assert e.code==401,e
          access={"X-MarketRadar-Key":"ci-only-example"}
          payload=json.dumps({"query":"Яндекс Станция Мини 3 Про",
                              "shops":["ym"]},ensure_ascii=False).encode()
          request=urllib.request.Request(base+"/api/mobile/browser/start",data=payload,
                headers={"Content-Type":"application/json",**access},method="POST")
          with urllib.request.urlopen(request,timeout=15) as response:
              assert response.status==202,response.status
              job=json.load(response)
          job_id=job["id"]
          print("Created live browser search job",job_id[:8],"status",job["state"])
          result=None
          terminal={"finished","failed","cancelled","canceled"}
          for _ in range(14):
              with urllib.request.urlopen(urllib.request.Request(
                      base+"/api/mobile/browser/jobs/"+job_id,headers=access),timeout=10) as r:
                  result=json.load(r)
              assert result["state"] in terminal | {"running","queued","pending","starting"},result
              if result["state"] in terminal:
                  break
              time.sleep(2)
          assert isinstance(result["markets"].get("ym"),dict),result
          assert isinstance(result["offers"],list),result
          print("Cloud API job contract",json.dumps({
              "state":result["state"],
              "market_state":result["markets"]["ym"]["state"],
              "candidate_count":result["markets"]["ym"]["candidates"],
              "offer_count":len(result["offers"])},ensure_ascii=False))
          if result["state"] not in terminal:
              urllib.request.urlopen(urllib.request.Request(
                  base+"/api/mobile/browser/jobs/"+job_id,headers=access,method="DELETE"),timeout=10)
              print("Smoke job still active after polling window; cancelled cleanly")
          # This is deployment/API smoke only. Market access is a separate
          # live acceptance gate and can still be HTTP 403/498 in GitHub CI.
          PY
      - name: Show logs and stop server
        if: always()
        run: |
          docker logs --tail=100 marketradar-backend-smoke || true
          docker exec marketradar-backend-smoke cat /tmp/marketradar-xvfb.log || true
          docker exec marketradar-backend-smoke ps -ef || true
          docker stop marketradar-backend-smoke || true
