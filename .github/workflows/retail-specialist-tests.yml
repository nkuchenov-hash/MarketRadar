name: Retail specialist worker tests
on:
  push:
    branches: [main]
    paths: ["deploy/retail-specialist-*.mjs","deploy/parserdata-specialist-core.mjs","deploy/test-parserdata-specialist.mjs","deploy/test-retail-specialist.mjs",".github/workflows/retail-specialist-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check deploy/retail-specialist-service.mjs && node deploy/test-retail-specialist.mjs && node deploy/test-parserdata-specialist.mjs
