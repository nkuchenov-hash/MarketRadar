name: Cloud Chromium real storefront search (public)
on:
  push:
    branches: [main]
    paths:
      - 'server/cloud_browser.py'
      - 'server/human_navigation.py'
      - 'server/test_human_navigation.py'
      - 'server/agent.py'
      - 'server/main.py'
      - 'server/mobile_cloud.py'
      - 'server/test_mobile_api.py'
      - 'server/public_html.py'
      - 'server/test_public_html.py'
      - 'requirements.txt'
      - 'server/test_cloud_browser.py'
      - '.github/workflows/cloud-browser-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chromium-probe-main
  cancel-in-progress: true
jobs:
  live-browser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m compileall -q server
          python -m unittest server.test_cloud_browser server.test_human_navigation server.test_mobile_api server.test_public_html -v
      - name: Browser search with price ordering and captured network responses
        env:
          CLOUD_BROWSER_ENABLED: "true"
          CLOUD_SEARCH_SCROLLS: "17"
          CLOUD_BROWSER_HEADFUL: "true"
          CLOUD_BROWSER_PERSISTENT: "true"
          CLOUD_BROWSER_HUMAN_FLOW: "true"
          CLOUD_BROWSER_PROFILE_DIR: /tmp/market-profiles
        run: |
          xvfb-run -a python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from urllib.parse import quote
          from server.cloud_browser import CloudBrowser, sorted_search_url, network_products
          from server.mobile_cloud import exact_product

          async def main():
              q = "Яндекс Станция Мини 3 Про"
              urls = {
                  "Яндекс Маркет": "https://market.yandex.ru/search?text=" + quote(q),
                  "Wildberries": "https://www.wildberries.ru/catalog/0/search.aspx?search=" + quote(q),
                  "Ozon": "https://www.ozon.ru/search/?text=" + quote(q),
              }
              findings = {}
              for market,url in urls.items():
                  browser = CloudBrowser(market=market)
                  try:
                      # Startup can fail before navigation (missing executable,
                      # profile lock, launch timeout). Record it per storefront.
                      await browser.start()
                      result = await browser.snapshot(url)
                      links = result.get("links", [])
                      examples = [{
                          "price": x.get("price"),
                          "title": x.get("title"),
                          "url": x.get("url"),
                          "source": x.get("source"),
                          "delivery":x.get("delivery_hint",""),
                          "has_image":bool(x.get("image_url",""))
                      } for x in links[:12]]
                      exact=sorted(
                          [x for x in links if x.get("price",0)>0 and
                           exact_product(q,x.get("title",""))],
                          key=lambda x:x["price"])
                      exact_examples=[{
                          "price":x["price"],"title":x.get("title",""),
                          "url":x.get("url",""),
                          "delivery":x.get("delivery_hint",""),
                          "price_evidence":x.get("source",""),
                          "has_image":bool(x.get("image_url",""))
                      } for x in exact[:20]]
                      findings[market] = {
                          "state":result.get("state"),"requested_url":sorted_search_url(url),
                          "final_url":result.get("url"),"page_title":result.get("title"),
                          "total_products":len(links),"exact_priced_matches":len(exact),
                          "cheapest_exact_listing_price":min(
                              (x["price"] for x in exact),default=None),
                          "coverage_complete":result.get("coverage_complete"),
                          "audit":result.get("audit",{}),
                          "diagnostic":result.get("diagnostic",""),
                          "sample":examples,
                          "cheapest_exact_examples":exact_examples,
                          "body_start":result.get("text","")[:350],
                      }
                      print(market, json.dumps(findings[market],ensure_ascii=False))
                  except Exception as exc:
                      # A navigation failure must not erase prior storefront evidence,
                      # nor masquerade as an empty but successfully searched catalog.
                      findings[market] = {
                          "state": "error",
                          "requested_url": sorted_search_url(url),
                          "diagnostic": type(exc).__name__ + ": " + str(exc),
                          "coverage_complete": False,
                          "total_products": 0,
                          "exact_priced_matches": 0,
                          "audit": {"failure_stage": "chromium_start_or_snapshot"},
                      }
                      # Continue probing the other stores: one blocked IP must
                      # not suppress independent live evidence from them.
                  finally:
                      # Persist both successful and failed marketplace outcomes
                      # before closing Chromium, even if close itself fails.
                      Path("live-storefront-search.json").write_text(
                          json.dumps(findings,ensure_ascii=False,indent=2), encoding="utf-8")
                      try:
                          await browser.close()
                      except Exception as close_exc:
                          # Browser shutdown must not prevent probing the next store.
                          # Preserve a separate cleanup diagnostic without erasing
                          # the actual search result or its original exception.
                          findings[market]["browser_close_error"] = (
                              type(close_exc).__name__ + ": " + str(close_exc))
                          Path("live-storefront-search.json").write_text(
                              json.dumps(findings,ensure_ascii=False,indent=2), encoding="utf-8")
              Path("live-storefront-search.json").write_text(
                  json.dumps(findings,ensure_ascii=False,indent=2), encoding="utf-8")
              failed=[market for market,record in findings.items()
                      if record["state"]!="ok" or record["exact_priced_matches"]<1]
              not_human=[]
              for market,record in findings.items():
                  audit=record.get("audit") or {}
                  nav=audit.get("navigation") or audit.get("browser_navigation") or {}
                  if not (nav.get("search_ui_submitted") and
                          audit.get("sort_ui_confirmed")):
                      not_human.append(market)
              errors=[]
              if failed:
                  errors.append("No genuine exact-model priced listings from: " +
                                ", ".join(failed))
              if not_human:
                  errors.append("Typed search and cheap-first sort NOT proven in live Chromium for: " +
                                ", ".join(not_human))
              if errors:
                  raise RuntimeError("; ".join(errors))
              # The acceptance gate must catch a priced HTML extraction
              # that never typed into the real website or clicked its sort.
              # A successful search URL request is NOT human-style browsing.
              not_human=[]
              for market,record in findings.items():
                  nav=(record.get("audit") or {}).get("navigation") or {}
                  if not (nav.get("search_query_typed") and
                          nav.get("search_ui_submitted") and
                          nav.get("sort_ui_selected")):
                      not_human.append(market)
              if not_human:
                  raise RuntimeError(
                      "Shopper UI sequence was NOT completed (type, submit, sort): " +
                      ", ".join(not_human))
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-chromium-live-search
          path: live-storefront-search.json
          retention-days: 7
